<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection Application</title>
    <script src="./static/mywebscript.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 50px;
        }
        .main-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 35px;
        }
        .header-title {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .btn-custom {
            background-color: #0066cc;
            color: white;
            font-weight: 600;
            border-radius: 6px;
            padding: 10px 25px;
        }
        .btn-custom:hover {
            background-color: #004c99;
            color: white;
        }
        #system_response {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.05rem;
            color: #333333;
            background-color: #f1f3f5;
            border-left: 5px solid #0066cc;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="main-card">
                    <h1 class="header-title text-center">Emotion Detector</h1>
                    <p class="text-muted text-center mb-4">Enter a sentence below to analyze its emotion using IBM Watson NLP.</p>
                    
                    <div class="mb-3">
                        <label for="textToAnalyze" class="form-label fw-bold">Text to Analyze:</label>
                        <textarea class="form-control" id="textToAnalyze" rows="4" placeholder="Type or paste your text here..."></textarea>
                    </div>
                    
                    <div class="text-center">
                        <button onclick="RunSentimentAnalysis()" class="btn btn-custom" id="submitBtn">Run Sentiment Analysis</button>
                    </div>
                    
                    <div id="system_response"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
